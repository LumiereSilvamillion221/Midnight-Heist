name: Build Rookwise Review APK
on:
  push:
    branches: [main]
    paths: ['chess-review/**', '.github/workflows/build-chess-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rookwise-review.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chess-${{ github.run_number }}
          name: Rookwise Review build ${{ github.run_number }}
          files: chess-review/rookwise-review.apk
